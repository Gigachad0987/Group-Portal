{% extends 'base.html' %}
{% block content %}
<div class="container py-4">

    <!-- Page header -->
    <div class="mb-4">
        <h2 class="mb-1">Edit message</h2>
        <p class="text-muted mb-0">
            Make changes to your message
        </p>
    </div>

    <!-- Form card -->
    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post" class="col-lg-8">
                {% csrf_token %}
                {{ form.non_field_errors }}

                <div class="mb-3">
                    <label for="{{ form.content.id_for_label }}" class="form-label">
                        Message
                    </label>
                    {{ form.content }}
                    {{ form.content.errors }}
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        Save changes
                    </button>

                    <a href="{% url 'forum:topic_detail' object.topic.pk %}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
